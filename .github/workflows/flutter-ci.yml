name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Exact version from environment.flutter, so a new stable release (new lints, new Dart) can't break an unchanged branch.
          flutter-version-file: pubspec.yaml
          cache: true

      # lib/firebase_options.dart is not committed (generated by `flutterfire configure`).
      # A typed stub with the generated file's API lets analyze and tests compile.
      - name: Create stub firebase_options.dart
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => throw UnsupportedError('CI stub: run `flutterfire configure` for the real options.');
          }
          EOF

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # test/ is included once it exists.
      - name: Check formatting
        run: dart format -o none --set-exit-if-changed lib $(test -d test && echo test)

      - name: Analyze project source
        run: flutter analyze

      # Skipped until the project has tests; `flutter test` fails without a test/ directory.
      - name: Run tests
        if: hashFiles('test/**/*_test.dart') != ''
        run: flutter test
